<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSJ 黑客帝國</title>
<style>
/* 白帽黑客任務：甜甜是誰？ — 中三 ICT 第 5 節 2.4 網絡安全（電腦室版）
   離線單一檔案：不用上網、不載入任何外部資源。 */
:root{
  --bg:#020814; --cyan:#38e8ff; --cyan2:#7ff3ff; --cyan-dim:rgba(56,232,255,.55);
  --panel:rgba(20,90,140,.16); --panel-line:rgba(56,232,255,.55);
  --ink:#dff8ff; --ink2:#9ccbe0; --dim:#5f8ea6;
  --pink:#ff4fd8; --red:#ff3b5c; --green:#39ff9e; --amber:#ffc23d;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  --sans:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
body{background:
  radial-gradient(ellipse at 50% -10%,rgba(56,232,255,.18),transparent 60%),
  radial-gradient(ellipse at 50% 120%,rgba(255,79,216,.10),transparent 55%),var(--bg)}
/* moving grid + scanlines */
#grid{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(56,232,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(56,232,255,.10) 1px,transparent 1px);
  background-size:44px 44px;animation:gridmove 12s linear infinite}
@keyframes gridmove{to{background-position:0 44px,44px 0}}
#scan{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#sweep{position:fixed;left:0;right:0;height:140px;top:-140px;pointer-events:none;z-index:49;
  background:linear-gradient(transparent,rgba(56,232,255,.06),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{to{top:110%}}
#app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:14px 16px 60px}

/* HUD bar */
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  border:1px solid var(--panel-line);background:rgba(4,30,50,.55);padding:8px 14px;margin-bottom:14px;
  font-family:var(--mono);font-size:14px;color:var(--cyan2);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.hud .lbl{color:var(--dim)}
.hud .score{color:var(--amber);font-size:18px}
.nodes{display:flex;gap:6px;align-items:center}
.nodes i{display:inline-block;width:22px;height:22px;border:1px solid var(--cyan-dim);transform:rotate(45deg);font-style:normal}
.nodes i span{display:block;transform:rotate(-45deg);text-align:center;font-size:11px;line-height:20px;color:var(--dim)}
.nodes i.done{background:rgba(57,255,158,.25);border-color:var(--green)} .nodes i.done span{color:var(--green)}
.nodes i.now{background:rgba(56,232,255,.3);border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)} .nodes i.now span{color:#fff}
.hud button{padding:3px 10px;font-size:13px}

/* hologram panel */
.holo{position:relative;background:var(--panel);border:1px solid var(--panel-line);padding:16px 18px;margin:0 0 14px;
  box-shadow:0 0 18px rgba(56,232,255,.18),inset 0 0 24px rgba(56,232,255,.08);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
.holo::before,.holo::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cyan);pointer-events:none}
.holo::before{top:4px;right:4px;border-left:none;border-bottom:none}
.holo::after{bottom:4px;left:4px;border-right:none;border-top:none}
.holo.static{animation:none}
@keyframes pop{0%{opacity:0;transform:scale(.6,.02);filter:brightness(3)}
  45%{opacity:1;transform:scale(1.02,.04)}65%{transform:scale(1,1.03);opacity:.7}
  75%{opacity:1}82%{opacity:.6}100%{opacity:1;transform:none;filter:none}}
.holo .ptitle{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--cyan);margin:-4px 0 10px;
  display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(56,232,255,.35);padding-bottom:6px}
.holo .ptitle .blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.holo.red{--panel-line:rgba(255,59,92,.75);background:rgba(120,10,30,.22);box-shadow:0 0 22px rgba(255,59,92,.35),inset 0 0 26px rgba(255,59,92,.12)}
.holo.red::before,.holo.red::after{border-color:var(--red)}
.holo.red .ptitle{color:var(--red);border-color:rgba(255,59,92,.4)}
.holo.pink{--panel-line:rgba(255,79,216,.7);background:rgba(110,20,90,.2)}
.holo.pink::before,.holo.pink::after{border-color:var(--pink)}
.holo.pink .ptitle{color:var(--pink);border-color:rgba(255,79,216,.4)}
.holo.green{--panel-line:rgba(57,255,158,.7);background:rgba(10,90,60,.18)}
.holo.green::before,.holo.green::after{border-color:var(--green)}
.holo.green .ptitle{color:var(--green);border-color:rgba(57,255,158,.4)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

h1,h2{font-weight:bold;letter-spacing:.04em;text-shadow:0 0 12px rgba(56,232,255,.8)}
h1{font-size:40px;margin:0} h2{font-size:28px;margin:0 0 6px}
.glow{color:var(--cyan2);text-shadow:0 0 10px var(--cyan)}
.codename{font-family:var(--mono);color:var(--cyan);letter-spacing:.2em;font-size:14px}
.term{color:var(--cyan2);border-bottom:1px dotted var(--cyan-dim)}
.en{font-family:var(--mono);font-size:.85em;color:var(--ink2)}
p{margin:6px 0}
.small{font-size:14px;color:var(--ink2)}
b{color:#fff}
.pinktxt{color:var(--pink)} .redtxt{color:var(--red)} .greentxt{color:var(--green)} .amber{color:var(--amber)}

.layout{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:1000px){.layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}

/* chat / packets */
.packet{font-family:var(--mono);background:rgba(0,0,0,.35);border-left:3px solid var(--cyan);padding:8px 12px;margin:8px 0}
.packet .meta{font-size:13px;color:var(--dim)}
.packet .data{font-size:24px;letter-spacing:.08em;color:var(--green);word-break:break-word}
.packet .data.enc{color:var(--pink)}
.packet .data span.l{cursor:pointer;border-radius:3px;padding:0 1px}
.packet .data span.l:hover,.packet .data span.l.on{background:rgba(255,194,61,.35);color:#fff}
.dm{background:rgba(255,79,216,.12);border:1px solid rgba(255,79,216,.5);padding:10px 14px;margin:8px 0;border-radius:4px 14px 14px 14px}
.dm .from{color:var(--pink);font-weight:bold}
.wifi{font-family:var(--sans);background:rgba(0,0,0,.35);padding:6px 12px}
.wifi div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid rgba(56,232,255,.15)}
.wifi div:last-child{border:none}
.wl{width:100%;border-collapse:collapse;font-size:15px}
.wl td,.wl th{border:1px solid rgba(56,232,255,.3);padding:5px 8px;text-align:left}
.wl th{color:var(--cyan);font-weight:normal;background:rgba(56,232,255,.08)}
.wl .mac{font-family:var(--mono)}

/* inputs & buttons */
input[type=text]{font:inherit;font-family:var(--mono);font-size:22px;letter-spacing:.06em;text-transform:uppercase;width:100%;max-width:520px;
  background:rgba(0,10,20,.7);color:var(--cyan2);border:1px solid var(--cyan-dim);padding:8px 12px;outline:none;caret-color:var(--cyan)}
input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(56,232,255,.5)}
input.plain{text-transform:none;font-family:var(--sans);font-size:18px;letter-spacing:0}
button{font:inherit;cursor:pointer;color:var(--cyan2);background:rgba(56,232,255,.12);border:1px solid var(--cyan);padding:8px 18px;
  letter-spacing:.06em;position:relative;overflow:hidden;transition:background .15s,box-shadow .15s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
button:hover:not(:disabled){background:rgba(56,232,255,.28);box-shadow:0 0 16px rgba(56,232,255,.6);color:#fff}
button:disabled{opacity:.45;cursor:default}
button .ripple{position:absolute;border-radius:50%;background:rgba(127,243,255,.6);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;font-size:17px}
.opt .k{font-family:var(--mono);color:var(--cyan);margin-right:8px}
.opt.wrong{border-color:var(--red);color:var(--red);background:rgba(255,59,92,.12)}
.opt.right{border-color:var(--green);color:var(--green);background:rgba(57,255,158,.15)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:10px;min-height:1.5em;font-weight:bold}
.fb .hint{color:var(--amber);font-weight:normal;display:block;margin-top:4px}
.qno{font-family:var(--mono);color:var(--amber)}
.qdone{font-size:15px;color:var(--ink2);border-left:3px solid var(--green);padding:4px 10px;margin:0 0 8px;background:rgba(57,255,158,.06)}
.qdone b{color:var(--green)}

/* lock screen */
.lockwrap{max-width:640px;margin:30px auto;text-align:center}
.ringbox{position:relative;width:170px;height:170px;margin:4px auto 10px}
.ringbox .r{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--cyan-dim);animation:spin 9s linear infinite}
.ringbox .r2{inset:18px;border-style:solid;border-color:transparent var(--cyan) transparent var(--cyan);animation-duration:3.5s;animation-direction:reverse}
.ringbox .r3{inset:40px;border:1px solid var(--pink);opacity:.6;animation-duration:6s}
.ringbox .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;filter:drop-shadow(0 0 10px var(--cyan))}
@keyframes spin{to{transform:rotate(360deg)}}
.granted{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(2,8,20,.85);font-family:var(--mono);animation:fadeout 1.5s forwards}
.granted .t{font-size:52px;color:var(--green);letter-spacing:.2em;text-shadow:0 0 20px var(--green);animation:glitch .3s 3}
.granted .s{color:var(--ink2);margin-top:8px;font-family:var(--sans)}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-4px,2px);text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}
  50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px);text-shadow:-3px 0 var(--pink),3px 0 var(--cyan)}100%{transform:none}}

/* decoder */
.decoder{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.decoder svg{flex:0 0 auto}
.decoder svg text{font-family:var(--mono);font-size:15px;text-anchor:middle;dominant-baseline:central}
#inner{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.keyctl{display:flex;align-items:center;gap:8px;font-size:15px}
.keyctl .k{font-family:var(--mono);font-size:34px;color:var(--amber);min-width:46px;text-align:center;text-shadow:0 0 10px var(--amber)}
.strip{overflow-x:auto;margin-top:8px}
.strip table{border-collapse:collapse;font-family:var(--mono);font-size:16px}
.strip td,.strip th{border:1px solid rgba(56,232,255,.25);width:26px;height:28px;text-align:center;padding:0}
.strip th{font-family:var(--sans);font-size:12px;color:var(--ink2);font-weight:normal;padding:0 6px;width:auto;white-space:nowrap}
.strip tr.c td{color:var(--pink)} .strip tr.p td{color:var(--green);background:rgba(57,255,158,.07)}
.strip td.hl{background:rgba(255,194,61,.4)!important;color:#fff!important}

/* boss */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.dcard{text-align:left;padding:12px;font-size:16px;min-height:74px}
.dcard .k{font-family:var(--mono);font-size:22px;color:var(--cyan);display:block}
.dcard .pts{display:block;font-family:var(--mono);font-size:15px;margin-top:6px}
.dcard .why{display:block;font-size:14px;color:var(--ink);margin-top:4px;line-height:1.45}
.dcard.p2{border-color:var(--green);background:rgba(57,255,158,.14)} .dcard.p2 .pts{color:var(--green)}
.dcard.p1{border-color:var(--amber);background:rgba(255,194,61,.12)} .dcard.p1 .pts{color:var(--amber)}
.dcard.p0{border-color:rgba(255,59,92,.6);background:rgba(255,59,92,.08)} .dcard.p0 .pts{color:var(--red)}
.dcard.mine{outline:3px solid #fff;outline-offset:2px}
.alert{font-family:var(--mono);color:var(--red);font-size:22px;letter-spacing:.12em;animation:blink 1s steps(2) infinite;text-shadow:0 0 12px var(--red)}

/* boot + ending */
.boot{font-family:var(--mono);color:var(--green);font-size:15px;white-space:pre-wrap;min-height:150px}
.title-hero{text-align:center;margin:16px 0 18px}
.title-hero h1{font-size:46px;animation:glitch .35s 4 .2s}
.title-hero .sub{font-family:var(--mono);color:var(--cyan);letter-spacing:.3em;font-size:14px;margin-top:4px}
.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile .avatar{width:110px;height:110px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:58px;flex:0 0 auto}
.profile.fake{color:var(--pink)} .profile.real{color:var(--red)}
.profile table td{padding:2px 10px 2px 0;color:var(--ink)}
.profile table td:first-child{color:var(--dim);font-family:var(--mono);font-size:14px}
.glitchout{animation:glitchout 1.2s forwards}
@keyframes glitchout{0%{opacity:1}20%{transform:translate(-6px,0);filter:hue-rotate(90deg)}40%{transform:translate(6px,0);opacity:.6}
  60%{transform:skewX(20deg);opacity:.9}80%{opacity:.2}100%{opacity:0;height:0;margin:0;padding:0;border:0}}
.stars td:nth-child(2){font-family:var(--mono);color:var(--amber);white-space:nowrap}
.cert{text-align:center}
.cert .big{font-family:var(--mono);font-size:58px;color:var(--amber);text-shadow:0 0 18px var(--amber)}
.cert .rank{font-size:24px;color:var(--green);text-shadow:0 0 10px var(--green)}
.card-info{background:rgba(255,194,61,.07);border:1px dashed rgba(255,194,61,.55);padding:10px 14px;margin:10px 0 4px}
.card-info p{margin:6px 0}
.nodes{flex-wrap:wrap}
.nodes i{width:24px;height:24px}
select.plain{font:inherit;font-size:18px;background:rgba(0,10,20,.7);color:var(--cyan2);border:1px solid var(--cyan-dim);padding:8px 12px;width:100%;max-width:520px}
.syms{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px;max-width:420px}
.syms .sym{padding:6px 0;font-size:20px;text-align:center;clip-path:none}
#net{font-size:12px}
.typing::after{content:"▌";color:var(--cyan);animation:blink .8s steps(2) infinite}
@media (max-width:600px){.granted .t{font-size:30px}.hud{font-size:12px}.decoder svg{width:220px;height:220px}h1{font-size:30px}.title-hero h1{font-size:32px}.packet .data{font-size:19px}}
</style>
</head>
<body>
<div id="grid"></div><div id="sweep"></div><div id="scan"></div>
<div id="app"></div>
<script src="config.js"></script>

<script>
"use strict";
/* ================= 內容 =================
   通關密語由老師口頭講出，只存雜湊值；一定要按次序解鎖，不可以跳關。老師密語只解鎖當前這一關。 */

const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const h32 = t => { let h = 0x811c9dc5; for (const c of t) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); };
const MASTER_H = "3c80da3f";
const lockLabel = m => m < 5 ? `入職考核 ${m + 1}` : `第 ${m - 4} 個任務`;
const shift = (s, k) => s.replace(/[A-Z]/g, c => A[(A.indexOf(c) + k + 260) % 26]);
const norm = s => (s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const pkt = (meta, text, enc) =>
  `<div class="packet"><div class="meta">${meta}</div><div class="data${enc ? " enc" : ""}" ${enc ? 'data-cipher="1"' : ""}>${text}</div></div>`;
const boss = "🕵️ <b>隊長</b>：";

const DEF = [
  ["A", "WPA3／WPA2 加密"],
  ["B", "強密碼"],
  ["C", "隱藏 SSID"],
  ["D", "MAC 位址過濾"],
  ["E", "改用流動數據"]
];

const MISSIONS = [
 { h: "7975cd3e", nl: "考1", name: "入職考核 1：LAN 和 WAN", op: "TRAINING 01",
   brief: `<p>${boss}新人，歡迎來到網絡安全小隊！接手真正的案件之前，你要先通過<b>五關入職考核</b>，證明你懂得網絡的基本功。</p>
     <div class="card-info"><b class="amber">📇 情報卡 · 第 1 課</b>
     <p><b>局部區域網絡</b> <span class="en">(Local Area Network, LAN)</span>：覆蓋一個房間、一座樓、一間學校；<b>自己擁有，不用付費</b>。例：家中 Wi-Fi、學校網絡、AirDrop、藍牙。</p>
     <p><b>寬廣區域網絡</b> <span class="en">(Wide Area Network, WAN)</span>：覆蓋一個城市、一個國家、全世界；要向<b>互聯網服務供應商</b> <span class="en">(ISP)</span> 購買。例：互聯網、WhatsApp、Instagram。</p>
     <p>約 <b>99%</b> 的國際數據經<b>海底電纜</b>傳送，中間的光纖只有頭髮般幼細。</p></div>`,
   data: `<div class="ptitle"><span>一句記住</span><span>MEMO</span></div>
     <p>數據<b>不用「出門」</b> → LAN；數據要<b>「出門」繞一大圈</b> → WAN。</p>`,
   items: [
    {t: "mc", q: "你用 AirDrop 把相片傳給坐在旁邊的同學。這屬於？", opts: ["局部區域網絡 LAN", "寬廣區域網絡 WAN"], a: 0, hint: "數據有沒有離開這個課室？"},
    {t: "mc", q: "你用 WhatsApp 把相片傳給在英國讀書的表哥。這屬於？", opts: ["局部區域網絡 LAN", "寬廣區域網絡 WAN"], a: 1, hint: "數據要去到很遠的地方。"},
    {t: "mc", q: "你發訊息到英國，大部分國際數據經甚麼傳送？", opts: ["人造衛星", "海底電纜", "藍牙"], a: 1, hint: "99% 走這條路，裏面是光纖。"}
   ],
   outro: `<p>考核 1 合格！記住：LAN 自己擁有、範圍細；WAN 向 ISP 購買、範圍大。</p>` },

 { h: "e5df9a10", nl: "考2", name: "入職考核 2：兩種網絡類型", op: "TRAINING 02",
   brief: `<p>${boss}第二關：網絡裏的電腦怎樣「分工」？</p>
     <div class="card-info"><b class="amber">📇 情報卡 · 第 1 課</b>
     <p><b>對等網絡</b> <span class="en">(peer-to-peer)</span>：像同學之間直接借東西，<b>沒有班長，人人平等</b>。例：AirDrop、藍牙、BitTorrent。</p>
     <p><b>客戶／伺服器網絡</b> <span class="en">(client/server)</span>：像所有東西先交給班主任，由<b>中央伺服器</b>管理和分派。例：Instagram、微信、Google Classroom、網上理財。</p>
     <p>BitTorrent：每個下載的人<b>一邊取、一邊給</b>，所以人越多越快。</p></div>`,
   data: `<div class="ptitle"><span>一句記住</span><span>MEMO</span></div><p>有沒有一部<b>中央伺服器</b>？有 → 客戶／伺服器；沒有 → 對等。</p>`,
   items: [
    {t: "mc", q: "以下哪一個<b>沒有</b>採用客戶／伺服器網絡？", opts: ["Instagram", "網上理財系統", "BitTorrent", "Google Classroom"], a: 2,
     hint: "哪一個是人人一邊取、一邊給？"},
    {t: "mc", q: "演唱會網上搶票，人越多網站越容易癱瘓。為甚麼？",

   outro: `<p>考核 2 合格！BitTorrent 人多力量大；搶票網站只有一部中央伺服器，人一多就塞住。</p>` },

 { h: "6a8d51ef", nl: "考3", name: "入職考核 3：網絡佈局", op: "TRAINING 03",
   brief: `<p>${boss}第三關：裝置之間用甚麼形狀連接？</p>
     <div class="card-info"><b class="amber">📇 情報卡 · 第 2 節</b>
     <p><b>星形</b>：全部連接到中間一部裝置。斷一條線只影響一部裝置，找問題也容易；但<b>中間那部一壞，全部停頓</b>。現在的學校和辦公室大多用星形。</p>
     <p><b>環形</b>：圍成一個圈。　<b>匯流排</b>：一條主幹由頭穿到尾，主幹斷了，斷口另一邊就連不上。</p>
     <p><b>網狀</b>：每一部裝置都直接連接其他所有裝置。</p></div>`,
   data: `<div class="ptitle"><span>四種佈局</span><span>TOPOLOGY</span></div>
     <p style="font-family:var(--mono);font-size:18px;line-height:2">★ 星形　○ 環形　━ 匯流排　✳ 網狀</p>`,
   items: [
    {t: "mc", q: "現在的學校和辦公室，大多用哪一種網絡佈局？", opts: ["環形", "匯流排", "星形", "網狀"], a: 2, hint: "斷一條線只影響一個人。"},
    {t: "mc", q: "星形佈局中間那部裝置壞了，會怎樣？", opts: ["只有一部電腦受影響", "全部裝置都不能互相通訊", "沒有影響"], a: 1,
     hint: "所有線都連去它那裏。"},
    {t: "mc", q: "每一部裝置都直接連接其他所有裝置，是哪一種佈局？", opts: ["網狀", "星形", "匯流排"], a: 0, hint: "像一張網。"}
   ],
   outro: `<p>考核 3 合格！星形佈局中間那部裝置是甚麼？就是下一關的主角之一。</p>` },

 { h: "ff0f9d76", nl: "考4", name: "入職考核 4：網絡連接裝置", op: "TRAINING 04",
   brief: `<p>${boss}第四關：數據由你的手機去到 YouTube，中間經過哪些裝置？</p>
     <div class="card-info"><b class="amber">📇 情報卡 · 第 3 節</b>
     <p><b>網絡界面卡</b> <span class="en">(NIC)</span>：令裝置可以上網。每張卡有一個獨一無二的 <b>MAC 位址</b>（48 位元），像身份證號碼。</p>
     <p><b>集線器</b> <span class="en">(hub)</span>：見人就派，保安低。<b>交換器</b> <span class="en">(switch)</span>：靠 <b>MAC 位址</b>只派給指定的裝置。</p>
     <p><b>路由器</b> <span class="en">(router)</span>：把兩個網絡（例如家中 LAN 和互聯網 WAN）連接起來，並為數據找最短路徑。</p>
     <p><b>數據機</b> <span class="en">(modem)</span>：訊號的翻譯員，例如把光纖的光訊號翻譯成電腦看得懂的電子訊號。</p></div>`,
   data: `<div class="ptitle"><span>由手機到 YouTube</span><span>PATH</span></div>
     <p>手機（網絡界面卡）→ Wi-Fi → 交換器 → 路由器 → 數據機 → 互聯網</p>`,
   items: [
    {t: "mc", q: "交換器靠甚麼決定把數據派給哪一部裝置？", opts: ["Wi-Fi 密碼", "MAC 位址", "電話號碼"], a: 1, hint: "每張網絡界面卡都有一個。"},
    {t: "text", q: "MAC 位址一共有多少位元？（輸入數字）", a: ["48"], hint: "6 組 × 8 位元。"},
    {t: "mc", q: "把家中的局部區域網絡，連接到互聯網（寬廣區域網絡）的是？", opts: ["集線器", "交換器", "路由器"], a: 2,
     hint: "像郵局，連接兩個網絡。"},
    {t: "mc", q: "光纖入屋之後，負責把「光」翻譯成電腦看得懂的電子訊號的是？", opts: ["數據機", "交換器", "網絡界面卡"], a: 0,
     hint: "modulate + demodulate。"}
   ],
   outro: `<p>考核 4 合格！最常考：交換器連接<b>同一個</b>局部區域網絡內的裝置；路由器把<b>兩個網絡</b>連接起來。</p>` },

 { h: "747e42b6", nl: "考5", name: "入職考核 5：電纜和無線", op: "TRAINING 05",
   brief: `<p>${boss}最後一關考核：數據經甚麼「路」傳送？</p>
     <div class="card-info"><b class="amber">📇 情報卡 · 第 3–4 節</b>
     <p><b>有線</b>：雙扭線（RJ45 接頭）、同軸電纜、<b>光纖</b>（用光傳送，幼如頭髮，<b>最快、傳得最遠</b>）。</p>
     <p><b>Wi-Fi</b>：<b>2.4 GHz</b> 傳得遠、穿牆好但較慢；<b>5 GHz</b> 較快但穿牆差。流動網絡 3G／4G／5G 出街都用到。</p>
     <p><b>藍牙</b>：無線耳機。<b>RFID</b>：八達通卡、防盜標籤。<b>NFC</b>：要貼近、雙向，Apple Pay 用它。</p></div>`,
   data: `<div class="ptitle"><span>由遠到近</span><span>WIRELESS</span></div>
     <p>衛星 → 流動網絡 → Wi-Fi → 藍牙 → RFID → NFC</p>`,
   items: [
    {t: "mc", q: "哪一種電纜用光傳送數據，速度最快、傳得最遠？", opts: ["雙扭線", "同軸電纜", "光纖"], a: 2, hint: "幼如頭髮。"},
    {t: "mc", q: "你在家中，和路由器隔了幾幅牆。應該連哪一個 Wi-Fi？", opts: ["2.4 GHz", "5 GHz"], a: 0, hint: "哪一個穿牆較好？"},
    {t: "mc", q: "嘟八達通卡入閘，用的是哪一種技術？", opts: ["藍牙", "RFID", "衛星"], a: 1, hint: "防盜標籤也用它。"},
    {t: "mc", q: "用 Apple Pay 在便利店付款，用的是哪一種技術？", opts: ["NFC", "Wi-Fi", "藍牙"], a: 0, hint: "要貼近、雙向。"}
   ],
   outro: `<p>五關考核全部合格！🎖️ 你正式成為<b>白帽黑客實習生</b>。</p>
     <p>隊長：「好，我有一宗真正的案件交給你……」</p>` },

 { h: "c95fbe21", nl: "1", name: "任務一：偷聽", op: "OPERATION SNIFF",
   brief: `<p>${boss}考核合格，正式開工！這是你的第一宗案件。</p>
     <p>中三學生<b>莎莎</b>最近在網上認識了一個自稱女生的網友「<b class="pinktxt">甜甜</b>」。甜甜很快就說和莎莎<b>好投契</b>，想和她做好姊妹，而且好像<b>非常了解</b>她。</p>
     <p>莎莎最好的朋友，就是你——<b class="amber">「{NAME}」</b>。你覺得甜甜很可疑，決定用黑客技術查個清楚。</p>
     <p>莎莎放學後常常在商場用<b>沒有鎖頭的免費 Wi-Fi</b> 傳訊息給你。你的第一個任務：接上同一個 Wi-Fi，
     用<span class="term">封包監察器</span> <span class="en">(packet sniffer)</span> 看看這個 Wi-Fi 上的訊息有多容易被人看到。</p>`,
   data: `<div class="ptitle"><span>PACKET SNIFFER · MegaMall_Free_WiFi</span><span class="blink">● REC</span></div>
     ${pkt("16:42:07 · 莎莎的手機 → 「{NAME}」的手機", "THE WIFI PASSWORD IS LUCKY")}`,
   items: [
    {t: "text", q: "莎莎告訴了你甚麼？輸入莎莎屋企的 Wi-Fi 密碼。", a: ["LUCKY"], hint: "看訊息最後一個字。"},
    {t: "mc", q: "在沒有加密的 Wi-Fi 上，誰看得到莎莎這段訊息？",
     opts: ["只有我", "只有我和商場職員", "同一個 Wi-Fi 上任何一個有心人"], a: 2,
     hint: "監察器截到的是整個 Wi-Fi 上的數據，不只是傳給你的。"}
   ],
   outro: `<p>你用監察器看得到，<b>其他人也看得到</b>。沒有加密的數據，經過的每一個人都看得到內容。</p>
     <p>監察器還發現：同一個 Wi-Fi 上，有另一部裝置一直在截取莎莎的訊息。裝置名稱是……</p>
     <p class="pinktxt" style="font-family:var(--mono);font-size:24px">▶ TimTim-iPhone</p><p>TimTim……「甜甜」？🤔</p>` },

 { h: "299b46bc", nl: "2", name: "任務二：上鎖", op: "OPERATION CIPHER",
   brief: `<p>${boss}我已經教莎莎和你把訊息<span class="term">加密</span> <span class="en">(encryption)</span>：</p>
     <p>每個字母<b>向後移 3 位</b>（A→D，B→E，C→F……）。「向後移」是加密方法，「<b class="amber">3</b>」就是
     <span class="term">鎖匙／密鑰</span> <span class="en">(key)</span>，只有莎莎和你知道。</p>
     <p>加密前看得懂的文字叫<span class="term">明文</span> <span class="en">(plaintext)</span>；加密後的亂碼叫<span class="term">密文</span> <span class="en">(ciphertext)</span>。</p>
     <p>莎莎剛傳來一段密文。你手上有鎖匙，用解密器把它解開。</p>`,
   data: `<div class="ptitle"><span>「{NAME}」的手機 · 收到新訊息</span><span>🔒</span></div>
     ${pkt("17:05:33 · 莎莎 → 「{NAME}」", "PHHW DW OLEUDUB", true)}`,
   wheel: {fixed: 3},
   items: [
    {t: "text", q: "用解密器（鎖匙 3）解開莎莎的訊息。", a: ["MEET AT LIBRARY"],
     hint: "在解密器找粉紅色的密文字母，對應的綠色字母就是明文：P→M，H→E……"},
    {t: "mc", q: "在這個加密方法中，「3」叫做甚麼？",
     opts: ["明文 (plaintext)", "鎖匙／密鑰 (key)", "Wi-Fi 名稱 (SSID)"], a: 1, hint: "只有莎莎和你知道它。"}
   ],
   outro: `<p>同一時間，TimTim-iPhone 截到的只是 <span class="pinktxt" style="font-family:var(--mono)">PHHW DW OLEUDUB</span>——一堆看不懂的亂碼。🔒</p>
     <p>加密之後，數據經過的人就算截到，也看不懂內容。</p>` },

 { h: "ed501756", nl: "3", name: "任務三：扮黑客", op: "OPERATION BREAK-IN",
   brief: `<p>${boss}加密了，就一定安全嗎？我們要測試一下。</p>
     <p>現在<b>你轉換角色，扮演偷看訊息的人</b>：假設你<b class="redtxt">沒有鎖匙</b>。不過莎莎和你<b>每一次都用同一條鎖匙</b>。</p>
     <p>你截到了三段密文。試試找出規律，把它們全部解開。</p>
     <p class="small">提示：按解密器的「−」「＋」可以轉動內圈，改變鎖匙。</p>`,
   data: `<div class="ptitle"><span>PACKET SNIFFER · 截到三段密文</span><span class="blink">● REC</span></div>
     ${pkt("密文 ①", "KHOOR", true)}${pkt("密文 ②", "L OLNH SLCCD", true)}${pkt("密文 ③", "VHH BRX DW WKH FDQWHHQ", true)}`,
   wheel: {fixed: null, start: 0},
   items: [
    {t: "text", q: "密文 ① KHOOR 是一個很常見的英文打招呼用語，有 5 個字母。它是甚麼？", a: ["HELLO"],
     hint: "第 3、4 個字母一樣（OO）。你見到朋友時會說……"},
    {t: "text", q: "那麼，莎莎和你用的鎖匙是多少？（輸入數字）", a: ["3"], hint: "H 變成 K，中間差了幾個字母？"},
    {t: "text", q: "解開密文 ② L OLNH SLCCD。", a: ["I LIKE PIZZA"], hint: "把解密器的鎖匙轉到你剛才找到的數字。"},
    {t: "text", q: "解開密文 ③ VHH BRX DW WKH FDQWHHQ。", a: ["SEE YOU AT THE CANTEEN"], hint: "同一條鎖匙。最後一個字是學校吃飯的地方。"},
    {t: "scene", cls: "pink", title: "攔截到新訊息 · 甜甜 → 莎莎",
     html: `<div class="dm"><span class="from">甜甜 💕</span><br>莎莎～我也很喜歡吃薄餅 (pizza) 呢😊 我們真的好投契！做我的好姊妹吧～<br>
       你可以先買一張 <b>$500 的遊戲點數卡</b>送給我嗎？明天在飯堂附近等你啊～</div>`},
    {t: "mc", q: "為甚麼甜甜這麼了解莎莎？",
     opts: ["她們真的很投契", "甜甜偷看了莎莎在 Wi-Fi 上傳送的訊息", "「{NAME}」其實就是甜甜本人 😱"], a: 1,
     hint: "你剛才扮演偷看訊息的人時，知道了莎莎甚麼事？"}
   ],
   outro: `<p>你成功了，<b class="redtxt">甜甜也成功了</b>。只要猜中一個字，就找到鎖匙，之後每段密文都看得懂。</p>
     <p>這就是舊式 Wi-Fi 加密 <b>WEP</b> <span class="en">(Wired Equivalent Privacy，有線等效加密)</span> 的弱點：
     <b>鎖匙一直不變</b>，黑客收集夠多數據就找到規律，數分鐘就能破解。</p>` },

 { h: "7a495697", nl: "4", name: "任務四：升級", op: "OPERATION ROTATE",
   brief: `<p>${boss}做得好！你找到了漏洞，我已經叫莎莎<b>不要買點數卡</b>。</p>
     <p>現在莎莎和你改用新方法：<b>每一段訊息都換一條新鎖匙</b>，鎖匙只有你們兩人知道。</p>
     <p>你再扮演一次偷看訊息的人，看看你上次的方法還行不行。</p>
     <div class="card-info"><b class="amber">📇 情報卡 · Wi-Fi 加密進化史</b>
     <p><b>WEP</b>（1999，Wired Equivalent Privacy）：鎖匙不變，數分鐘可被破解。<b>不要用。</b></p>
     <p><b>WPA</b>（2003，Wi-Fi Protected Access）：改用<b>不斷變更的密鑰</b>。</p>
     <p><b>WPA2</b>（2004）：加密更強，現時廣泛使用。</p>
     <p><b>WPA3</b>（2018）：<b>最新、最安全</b>，新路由器都支援。家用路由器選 WPA3（不支援就用 WPA2），再加一個強密碼。</p></div>`,
   data: `<div class="ptitle"><span>PACKET SNIFFER · 截到兩段新密文</span><span class="blink">● REC</span></div>
     ${pkt("密文 ④", "OLSSV", true)}${pkt("密文 ⑤", "IFMMP", true)}
     <div class="row"><button id="try3">用上次找到的鎖匙 3 解密</button><span id="try3out" style="font-family:var(--mono);font-size:20px"></span></div>`,
   wheel: {fixed: null, start: 3},
   items: [
    {t: "mc", q: "先按上面的按鈕，用鎖匙 3 解密。解出來的是亂碼，為甚麼？",
     opts: ["偷看的人的電腦壞了", "你們換了鎖匙", "訊息根本沒有加密"], a: 1, hint: "隊長剛才說你們改用了甚麼新方法？"},
    {t: "text", q: "挑戰：轉動解密器，逐條鎖匙試，解開密文 ④ OLSSV。", a: ["HELLO"], hint: "也是 5 個字母，第 3、4 個字母一樣……"},
    {t: "text", q: "再解開密文 ⑤ IFMMP。", a: ["HELLO"], hint: "鎖匙又不同了，再逐條試。"},
    {t: "mc", q: "這種「移位」加密法，一共只有多少條有用的鎖匙？", opts: ["25 條", "1,000 條", "100 萬條"], a: 0,
     hint: "英文有 26 個字母，移 26 位等於沒有移。"},
    {t: "mc", q: "莎莎家買了新路由器，加密方式應該選哪一種？", opts: ["WEP", "WPA", "WPA3"], a: 2,
     why: {0: "WEP 鎖匙不變，數分鐘就能被破解。", 1: "WPA 已經很舊了，有更新更安全的選擇。"}, hint: "看情報卡：最新、最安全的是哪一個？"}
   ],
   outro: `<p>密文 ④ 和 ⑤ 原來是<b>同一句話</b>，但鎖匙不同，看起來完全不一樣。就算你猜中一條鎖匙，下一段又換了，偷看的人很難找到規律。</p>
     <p>這就是 <b>WPA</b> <span class="en">(Wi-Fi Protected Access)</span> 的改進：用<b>不斷變更的密鑰</b>加密。</p>
     <p>「移位」加密只要試 25 次就能破解；但現今 <b>WPA2、WPA3</b> 的鎖匙，可能性多到 <b class="amber">3 後面有 38 個零</b>，全世界的電腦一起試也試不完。</p>` },

 { h: "8e88fbe3", nl: "5", name: "任務五：隱身和白名單", op: "OPERATION GHOST",
   brief: `<p>${boss}甜甜偷看不到訊息，就改變目標：他想<b>偷偷連上莎莎屋企的 Wi-Fi</b>。莎莎爸爸做了兩件事：</p>
     <p>① <b>隱藏 SSID</b>：<span class="term">SSID</span> <span class="en">(Service Set Identifier，服務設定識別碼)</span> 即是 Wi-Fi 的名稱。
     在路由器關閉 SSID 廣播，附近的裝置就<b>不會自動搜尋到</b>這個網絡。</p>
     <p>② <b>MAC 位址過濾</b>：<span class="term">MAC 位址</span> <span class="en">(Media Access Control address)</span> 就像裝置的身份證號碼。
     路由器只讓「<b>白名單</b>」上的裝置連線。</p>`,
   data: `<div class="ptitle"><span>莎莎屋企路由器 · 白名單</span><span>ROUTER ADMIN</span></div>
     <table class="wl"><tr><th>裝置</th><th>MAC 位址</th><th>可以連線</th></tr>
     <tr><td>爸爸的手機</td><td class="mac">3C:22:FB:A1:07:9E</td><td class="greentxt">✔</td></tr>
     <tr><td>莎莎的手提電腦</td><td class="mac">F0:18:98:4B:22:C1</td><td class="greentxt">✔</td></tr>
     <tr><td>莎莎的手機</td><td class="mac">8A:5D:13:EE:40:72</td><td class="greentxt">✔</td></tr></table>
     <p class="small">SSID 廣播：<b class="redtxt">關閉</b>　·　網絡名稱：SaSa_Home（附近的人看不到）</p>`,

  const el = $("net");

  const body = JSON.stringify({event, cls: S.cls, no: S.no, codename: S.name, score: total(), max: MAX, done,
    secs: Math.round(Object.values(S.t).reduce((a, b) => a + b, 0)), run: S.run || ""});
  fetch(SHEET_URL, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=utf-8"}, body})
    .then(() => { NET = "📡 已記錄"; const e = $("net"); if (e) e.textContent = NET; })
    .catch(() => { NET = "⚠ 未能記錄（遊戲照玩）"; const e = $("net"); if (e) e.textContent = NET; });
}

function beep(f = 880, d = .07, type = "square", vol = .04) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.stop(actx.currentTime + d);
  } catch (e) {}
}

/* 打字效果：點一下面板可以跳過 */
function typeIn(el, speed = 14) {
  const nodes = [], walk = n => n.childNodes.forEach(c => c.nodeType === 3 ? nodes.push(c) : walk(c));
  walk(el);
  const full = nodes.map(n => n.textContent);
  nodes.forEach(n => n.textContent = "");
  el.classList.add("typing");
  let ni = 0, ci = 0, done = false;
  const finish = () => { if (done) return; done = true; nodes.forEach((n, k) => n.textContent = full[k]); el.classList.remove("typing"); };
  const tick = () => {
    if (done) return;
    for (let s = 0; s < 2 && ni < nodes.length; s++) {
      if (ci < full[ni].length) nodes[ni].textContent = full[ni].slice(0, ++ci); else { ni++; ci = 0; }
    }
    if (ni >= nodes.length) finish(); else setTimeout(tick, speed);
  };
  el.addEventListener("click", finish); tick();
}

function renderMission() {
  const M = MISSIONS[S.m];
  const firstTime = !S.typed[S.m];
  if (M.wheel) wheelKey = M.wheel.fixed !== null ? M.wheel.fixed : (S.wheelKey != null && S.wheelM === S.m ? S.wheelKey : M.wheel.start);
  app.innerHTML = hud() + `
    <div class="codename">MISSION ${S.m + 1} / ${MISSIONS.length} · ${M.op}</div><h2>${M.name}</h2>
    <div class="layout"><div>
      ${panel("隊長通訊 · TRANSMISSION", `<div id="brief">${fillName(M.brief)}</div>`, "", "<span class='blink'>● LIVE</span>")}
      <div class="holo">${fillName(M.data)}</div>
    </div><div><div id="feed"></div>${M.wheel ? decoderHTML(M.wheel.fixed) : ""}</div></div>`;
  bindHud();
  if (firstTime) { typeIn($("brief")); S.typed[S.m] = true; save(); }
  if (M.wheel) bindDecoder(M.wheel.fixed);
  const t3 = $("try3");
  if (t3) t3.onclick = () => { $("try3out").innerHTML =
    `④ <span class="redtxt">${shift("OLSSV", -3)}</span>　⑤ <span class="redtxt">${shift("IFMMP", -3)}</span>　🤔`; sBad(); };
  // 已完成的題目
  for (let k = 0; k < S.i; k++) $("feed").insertAdjacentHTML("beforeend", doneHTML(M, k));
  showItem();
}

const fillName = t => t.replaceAll("{NAME}", S.name);

function doneHTML(M, k) {
  const it = M.items[k], key = `${S.m}-${k}`;
  if (it.t === "scene") return `<div class="holo static ${it.cls || ""}"><div class="ptitle"><span>${fillName(it.title)}</span><span></span></div>${fillName(it.html)}</div>`;
  const no = CIRC[qNo(S.m, k)];
  let ans = it.t === "mc" ? fillName(it.opts[it.a]) : it.t === "text" ? it.a[0] : `你選了 ${DEF[S.picks[key]][0]} ${DEF[S.picks[key]][1]}`;
  return `<div class="qdone"><span class="qno">${no}</span> ${it.t === "boss" ? "攻擊：" + it.attack : fillName(it.q)}<br>
    <b>${ans}</b>　<span class="small">+${S.scores[key] || 0} 分</span></div>`;
}

function showItem() {
  const M = MISSIONS[S.m], it = M.items[S.i], key = `${S.m}-${S.i}`, feed = $("feed");
  if (!it) return finishMission();
  const no = CIRC[qNo(S.m, S.i)];
  if (it.t === "scene") {
    feed.insertAdjacentHTML("beforeend", `<div class="holo ${it.cls || ""}" id="cur"><div class="ptitle"><span>${fillName(it.title)}</span><span class="blink">●</span></div>
      ${fillName(it.html)}<div class="row"><button id="cont">繼續 ▶</button></div></div>`);
    if (it.cls === "red") sBad(); else beep(1300, .1, "sine");
    $("cont").onclick = () => { $("cont").remove(); $("cur").removeAttribute("id"); S.i++; save(); showItem(); };
    scrollCur(); return;
  }
  if (it.t === "boss") return showBoss(it, key, no);
  const body = it.t === "mc"
    ? it.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span>${fillName(o)}</button>`).join("")
    : `<input type="text" id="ans" autocomplete="off" placeholder="在這裏輸入答案"><div class="row"><button id="sub">提交 ▶</button></div>`;
  feed.insertAdjacentHTML("beforeend", panel(`QUESTION <span class="qno">${no}</span>`, `<p>${fillName(it.q)}</p>${body}<div class="fb" id="fb"></div>`, "", "") .replace('class="holo ', 'id="cur" class="holo '));
  const fb = $("fb");
  const right = () => {
    S.scores[key] = Math.max(FLOOR, FULL - STEP * (S.wrongs[key] || 0));
    fb.innerHTML = `<span class="greentxt">✔ 正確！+${S.scores[key]} 分</span>`; sGood();
    $("score").textContent = total(); save();
    document.querySelectorAll("#cur button, #cur input").forEach(x => x.disabled = true);
    setTimeout(() => { const c = $("cur"); c.outerHTML = doneHTML(M, S.i); S.i++; save(); showItem(); }, 1000);
  };
  const wrong = (extra = "") => {
    S.wrongs[key] = (S.wrongs[key] || 0) + 1; save(); sBad();
    fb.innerHTML = `<span class="redtxt">✘ 不對，再試一次。</span>${extra ? `<span class="hint">${extra}</span>` : ""}` +
      (S.wrongs[key] >= 2 ? `<span class="hint">💡 提示：${fillName(it.hint)}</span>` : "");
    const c = $("cur"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  };
  if (it.t === "mc") {
    document.querySelectorAll("#cur .opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      if (k === it.a) { b.classList.add("right"); right(); }
      else { b.classList.add("wrong"); b.disabled = true; wrong(it.why && it.why[k] ? it.why[k] : ""); }
    });
  } else {
    const inp = $("ans");
    const go = () => { if (!norm(inp.value)) return; it.a.some(a => norm(a) === norm(inp.value)) ? right() : wrong(); };
    $("sub").onclick = go;
    inp.onkeydown = e => { if (e.key === "Enter") go(); };
    inp.focus({preventScroll: true});
  }
  scrollCur();
}

function showBoss(it, key, no) {
  const feed = $("feed");
  feed.insertAdjacentHTML("beforeend", `<div class="holo red" id="cur"><div class="ptitle"><span>⚠ 攻擊 <span class="qno">${no}</span></span><span class="blink">● ATTACK</span></div>
    <p class="alert">WARNING · 甜甜發動攻擊</p><p style="font-size:19px">${it.attack}</p>
    <p class="small">你用哪一招擋？只可以選一次。</p>
    <div class="cards">${DEF.map(([k, v], j) => `<button class="dcard" data-k="${j}"><span class="k">${k}</span>${v}</button>`).join("")}</div>
    <div class="fb" id="fb"></div></div>`);
  sBad();
  document.querySelectorAll("#cur .dcard").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = it.pts[k];
    S.picks[key] = k; S.scores[key] = p * 5; save(); $("score").textContent = total();
    p === 2 ? sGood() : sBad();
    document.querySelectorAll("#cur .dcard").forEach(c => {
      const j = +c.dataset.k; c.disabled = true; c.style.opacity = 1;
      c.classList.add("p" + it.pts[j]); if (j === k) c.classList.add("mine");
      c.insertAdjacentHTML("beforeend", `<span class="pts">${it.pts[j] * 5} 分${j === k ? " ← 你的選擇" : ""}</span><span class="why">${it.why[j]}</span>`);
    });
    $("fb").innerHTML = `<span class="${p === 2 ? "greentxt" : p === 1 ? "amber" : "redtxt"}">${p === 2 ? "✔ 成功擋下！" : p === 1 ? "△ 擋住了一部分。" : "✘ 擋不住！"} +${p * 5} 分</span>
      <span class="hint">重點：${it.point}</span><div class="row"><button id="cont">${S.i + 1 < MISSIONS[S.m].items.length ? "下一次攻擊 ▶" : "完成 ▶"}</button></div>`;
    $("cont").onclick = () => { $("cur").outerHTML = doneHTML(MISSIONS[S.m], S.i); S.i++; save(); showItem(); };
  });
  scrollCur();
}

function scrollCur() {
  const c = $("cur"); if (!c) return;
  if (window.innerWidth < 1000 || S.i > 0) setTimeout(() => c.scrollIntoView({behavior: "smooth", block: "center"}), 120);
}

function finishMission() {
  S.t[S.m] = (Date.now() - (S.t0[S.m] || Date.now())) / 1000; S.phase = "outro"; save(); report(S.m + 1 >= MISSIONS.length ? "end" : "stage"); render();
}

function renderOutro() {
  const M = MISSIONS[S.m], last = S.m + 1 >= MISSIONS.length;
  app.innerHTML = hud() + `<div class="lockwrap" style="max-width:820px;text-align:left">
    ${panel(`MISSION ${S.m + 1} COMPLETE`, `<h2 class="greentxt" style="text-shadow:0 0 12px var(--green)">✔ ${M.name}：完成！</h2>
      <div id="out">${fillName(M.outro)}</div><p class="small">這個任務用了 ${fmt(S.t[S.m] || 0)}。</p>
      <div class="row"><button id="nx">${last ? "查看調查報告 ▶" : "返回總部，等候下一個任務 ▶"}</button></div>`, "green", "● SUCCESS")}</div>`;
  bindHud(); typeIn($("out")); sGood();
  $("nx").onclick = () => { S.m++; S.phase = "lock"; S.i = 0; render(); };
}

/* ---------- 解密器 ---------- */
function decoderHTML(fixed) {
  const R1 = 128, R2 = 98, C = 150, step = 360 / 26;
  const ring = (r, cls, fill) => [...A].map((ch, j) => {
    const a = (j * step - 90) * Math.PI / 180;
    return `<text x="${C + r * Math.cos(a)}" y="${C + r * Math.sin(a)}" fill="${fill}" class="${cls}" data-l="${ch}">${ch}</text>`;
  }).join("");
  const ctl = fixed === null
    ? `<div class="keyctl">鎖匙 <button id="km">−</button><span class="k" id="kv">${wheelKey}</span><button id="kp">＋</button></div>`
    : `<div class="keyctl">鎖匙 <span class="k">${fixed}</span></div>`;
  return panel("解密器 · DECODER", `<div class="decoder">
    <svg width="250" height="250" viewBox="0 0 300 300" aria-label="解密轉盤">
      <circle cx="150" cy="150" r="143" fill="none" stroke="rgba(255,79,216,.5)"/>
      <circle cx="150" cy="150" r="113" fill="none" stroke="rgba(56,232,255,.4)" stroke-dasharray="3 5"/>
      <circle cx="150" cy="150" r="83" fill="none" stroke="rgba(57,255,158,.45)"/>
      <g id="outer">${ring(R1, "oc", "#ff4fd8")}</g>
      <g id="inner" style="transform-origin:150px 150px">${ring(R2, "ic", "#39ff9e")}</g>
      <text x="150" y="140" fill="#9ccbe0" style="font-size:12px">外圈 密文</text>
      <text x="150" y="160" fill="#9ccbe0" style="font-size:12px">內圈 明文</text>
    </svg>
    <div style="flex:1;min-width:220px">${ctl}
      <p class="small">解密：每個字母<b>向前移</b>鎖匙的位數。<br>外圈粉紅色＝密文，內圈綠色＝明文。<br>按上面密文的字母，可以在表中標出來。</p></div>
    </div><div class="strip" id="strip"></div>`, "", "ROT");
}
function bindDecoder(fixed) {
  const upd = () => {
    const k = fixed === null ? wheelKey : fixed;
    $("inner").style.transform = `rotate(${k * 360 / 26}deg)`;
    document.querySelectorAll("#inner text").forEach(t => {
      const deg = -k * 360 / 26, x = t.getAttribute("x"), y = t.getAttribute("y");
      t.setAttribute("transform", `rotate(${deg} ${x} ${y})`);
    });
    drawStrip();
    if ($("kv")) $("kv").textContent = k;
  };
  if (fixed === null) {
    $("km").onclick = () => { wheelKey = (wheelKey + 25) % 26; S.wheelKey = wheelKey; S.wheelM = S.m; save(); upd(); };
    $("kp").onclick = () => { wheelKey = (wheelKey + 1) % 26; S.wheelKey = wheelKey; S.wheelM = S.m; save(); upd(); };
  }
  document.querySelectorAll("[data-cipher]").forEach(el => {
    el.innerHTML = [...el.textContent].map(ch => /[A-Z]/.test(ch) ? `<span class="l">${ch}</span>` : ch).join("");
    el.querySelectorAll("span.l").forEach(sp => sp.onclick = () => {
      document.querySelectorAll("span.l.on").forEach(x => x.classList.remove("on"));
      sp.classList.add("on"); drawStrip(sp.textContent);
    });
  });
  upd();
}
function drawStrip(hl) {
  const M = MISSIONS[S.m], k = M.wheel.fixed === null ? wheelKey : M.wheel.fixed;
  const c = [...A].map(x => `<td class="${x === hl ? "hl" : ""}">${x}</td>`).join("");
  const p = [...A].map(x => `<td class="${x === hl ? "hl" : ""}">${shift(x, -k)}</td>`).join("");
  $("strip").innerHTML = `<table><tr class="c"><th>密文</th>${c}</tr><tr class="p"><th>明文</th>${p}</tr></table>`;
  document.querySelectorAll("#outer text, #inner text").forEach(t => t.style.filter = "");
  if (hl) {
    const o = document.querySelector(`#outer text[data-l="${hl}"]`), i = document.querySelector(`#inner text[data-l="${shift(hl, -k)}"]`);
    [o, i].forEach(t => t && (t.style.filter = "drop-shadow(0 0 4px #ffc23d) drop-shadow(0 0 8px #ffc23d)"));
  }
}

/* ---------- 結局 ---------- */
function renderEnd() {
  const secs = Object.values(S.t).reduce((a, b) => a + b, 0), sc = total();
  const rank = sc >= MAX * .9 ? "首席白帽黑客" : sc >= MAX * .7 ? "高級網絡探員" : "網絡安全實習生";
  app.innerHTML = hud() + `<div class="codename">CASE CLOSED</div><h2>調查報告：甜甜是誰？</h2>
    <div class="layout"><div>
      <div id="reveal">${panel("目標人物檔案", `<div class="profile fake" id="fakeProf"><div class="avatar">👧</div>
        <table><tr><td>網名</td><td>甜甜 💕</td></tr><tr><td>自稱</td><td>16 歲 · 女生</td></tr><tr><td>裝置</td><td>TimTim-iPhone</td></tr></table></div>`, "pink", "<span class='blink'>● 分析中……</span>")}</div>
      <div id="truth"></div>
    </div><div id="endR"></div></div>`;
  bindHud();
  setTimeout(() => {
    const f = $("fakeProf"); f.classList.add("glitchout"); sBad();
    setTimeout(() => {
      $("reveal").innerHTML = panel("真實身份 · 已確認", `<div class="profile real"><div class="avatar">🕶️</div>
        <table><tr><td>真身</td><td><b class="redtxt" style="font-size:22px">黑黑君</b></td></tr><tr><td>年齡</td><td>30 歲 · 男子</td></tr>
        <tr><td>手法</td><td>在網上扮女生，專騙中學生買遊戲點數卡</td></tr><tr><td>裝置</td><td>TimTim-iPhone</td></tr></table></div>`, "red", "● MATCH");
      $("truth").innerHTML = panel("案件真相", `<p>警方根據你的調查報告，找到 TimTim-iPhone 的主人——原來「甜甜」就是 <b class="redtxt">黑黑君</b>！</p>
        <p>他之所以那麼「了解」莎莎，全靠在商場免費 Wi-Fi 上<b>偷看沒有加密的訊息</b>。莎莎及時停手，<b class="greentxt">沒有損失</b>。</p>`);
      $("endR").innerHTML =
        panel("證書 · CERTIFICATE", `<div class="cert"><div class="codename">網絡安全小隊</div>
          <p>${S.cls} 班 ${S.no} 號<br>黑客名稱 <b style="font-size:22px">${S.name}</b></p>
          <p>通過 5 關入職考核，完成 7 個任務，識破網上交友騙案。</p>
          <div class="big">${sc} / ${MAX}</div><div class="rank">${rank}</div>
          <p>總用時 ${fmt(secs)}</p><p class="small">請舉手，讓老師看看你的分數。</p>
          <div class="row" style="justify-content:center"><button id="again">再玩一次 ↻</button></div></div>`, "green", "● VERIFIED") +
        panel("保護 Wi-Fi：哪一招最重要？", `<table class="wl stars">
          <tr><td>加密 (WPA3／WPA2)</td><td>★★★</td><td>最重要。不要用 WEP。</td></tr>
          <tr><td>強密碼</td><td>★★★</td><td>加密再強，密碼被猜中都沒用。</td></tr>
          <tr><td>隱藏 SSID</td><td>★</td><td>只擋得住普通人。</td></tr>
          <tr><td>MAC 位址過濾</td><td>★</td><td>MAC 位址可以被假冒。</td></tr>
          <tr><td>出街：小心公共 Wi-Fi</td><td>★★★</td><td>敏感的事用流動數據。</td></tr></table>`) +
        panel("防騙小貼士", `<p>● 網上認識的人，照片、名字、<b>性別</b>都可以是假的。不論男女，任何人都可能被騙。</p>
          <p>● 網友很快說喜歡你，然後要你買點數卡、轉錢 → <b class="redtxt">極可能是騙案</b>。</p>
          <p>● 懷疑被騙：香港打「防騙易」熱線 <b class="amber">18222</b>；內地反詐專線 <b class="amber">96110</b>。也要告訴家人或老師。</p>`, "pink");
      sGood();
    }, 1100);
  }, 1600);
}

document.addEventListener("click", e => {
  if (!e.target.closest("#again")) return;
  const keep = {cls: S.cls, no: S.no, name: S.name, sound: S.sound, booted: true, run: Date.now().toString(36)};
  S = Object.assign(fresh(), keep); render();
});

render();
</script>
</body>
</html>

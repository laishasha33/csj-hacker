<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑客排行榜</title>
<style>
:root{--bg:#020814;--cyan:#38e8ff;--cyan2:#7ff3ff;--ink:#dff8ff;--ink2:#9ccbe0;--amber:#ffc23d;--green:#39ff9e;--pink:#ff4fd8;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;--sans:"Microsoft JhengHei","微軟正黑體","PingFang TC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--sans);
  background:radial-gradient(ellipse at 50% -10%,rgba(56,232,255,.2),transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;
  background-image:linear-gradient(rgba(56,232,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(56,232,255,.1) 1px,transparent 1px);background-size:44px 44px}
main{position:relative;max-width:1100px;margin:0 auto;padding:20px 16px}
h1{text-align:center;font-size:44px;margin:6px 0;text-shadow:0 0 14px var(--cyan)}
.sub{text-align:center;font-family:var(--mono);color:var(--cyan);letter-spacing:.3em;font-size:14px}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
button{font:inherit;cursor:pointer;color:var(--cyan2);background:rgba(56,232,255,.12);border:1px solid var(--cyan);padding:8px 18px}
button.on{background:rgba(56,232,255,.35);color:#fff}
table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:26px}
td{padding:10px 16px;background:rgba(20,90,140,.18);border-top:1px solid rgba(56,232,255,.35);border-bottom:1px solid rgba(56,232,255,.35)}
td:first-child{font-family:var(--mono);color:var(--amber);width:90px;text-align:center;border-left:1px solid rgba(56,232,255,.35)}
td:last-child{border-right:1px solid rgba(56,232,255,.35)}
td.sc{font-family:var(--mono);color:var(--amber);text-align:right}
td.dn{font-size:16px;color:var(--ink2);text-align:right;white-space:nowrap}
tr.up td{animation:flash 1.2s}
@keyframes flash{0%{background:rgba(57,255,158,.45)}100%{background:rgba(20,90,140,.18)}}
.medal{font-size:34px}
.final tr:nth-child(-n+3) td{font-size:32px;background:rgba(255,194,61,.14)}
.final tr td.dn{font-size:16px}
.msg{text-align:center;color:var(--ink2);margin:20px}
@media (max-width:600px){h1{font-size:30px}table{font-size:18px}}
</style>
</head>
<body>
<main>
  <div class="sub">CSJ HACKER LEADERBOARD</div>
  <h1>黑客排行榜 · 頭 10 名</h1>
  <div class="bar"><button data-c="3A">3A</button><button data-c="3B">3B</button><button data-c="3C">3C</button><button data-c="TEST">TEST</button>
    <button id="fin">🏆 公布最終排名</button></div>
  <table id="tb"></table>
  <div class="msg" id="msg">選擇班別。每 10 秒自動更新；永久紀錄，每人只計最高分。</div>
</main>
<script src="config.js"></script>
<script>
const URL_ = window.SHEET_URL || "";
let cls = "", prev = {}, timer = null, final = false;
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
async function load() {
  if (!URL_) { document.getElementById("msg").textContent = "未設定成績記錄網址（config.js）。"; return; }
  if (!cls) return;
  try {
    const r = await fetch(URL_ + "?cls=" + encodeURIComponent(cls) + "&t=" + Date.now());
    const rows = await r.json();
    const medals = ["🥇", "🥈", "🥉"];
    document.getElementById("tb").className = final ? "final" : "";
    document.getElementById("tb").innerHTML = rows.map((x, i) => {
      const up = prev[x.codename] !== undefined && prev[x.codename] > i;
      return `<tr class="${up ? "up" : ""}"><td>${final && i < 3 ? `<span class="medal">${medals[i]}</span>` : i + 1}</td>
        <td>${esc(x.codename)}</td><td class="dn">完成 ${x.done} 關</td><td class="sc">${x.score}</td></tr>`;
    }).join("");
    prev = Object.fromEntries(rows.map((x, i) => [x.codename, i]));
    document.getElementById("msg").textContent = rows.length ? `${cls} · 更新時間 ${new Date().toLocaleTimeString("zh-HK")}` : `${cls} 還沒有成績。`;
  } catch (e) { document.getElementById("msg").textContent = "暫時讀取不到成績，稍後自動再試。"; }
}
document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b));
  cls = b.dataset.c; prev = {}; final = false; load(); clearInterval(timer); timer = setInterval(load, 10000);
});
document.getElementById("fin").onclick = () => { final = true; load(); };
</script>
</body>
</html>
